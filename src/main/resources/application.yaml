spring:
  application:
    name: product-service

  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/product-service?authSource=admin

#Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
  endpoint:
    health:
      show-details: always
  observations:
    key-values:
      application: product-service


  #Tracing configs
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces # Endpoint for traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs # Endpoint for logs
    otlp:
      metrics:
        export:
          endpoint: http://localhost:4318/v1/metrics # Endpoint for metrics
          step: 2s # Export interval
otel:
  service:
    name: product-service